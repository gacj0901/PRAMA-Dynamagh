[project]
name = "prama-dynamagh-backend"
version = "0.0.1"
description = "Phase 0 backend for PRAMA-Dynamagh"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "eth-hash[pycryptodome]>=0.7,<1",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
