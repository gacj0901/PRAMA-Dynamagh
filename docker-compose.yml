name: prama-dynamagh

services:
  contracts-test:
    profiles: ["tooling"]
    build: ./contracts
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prama_dynamagh}
      POSTGRES_USER: ${POSTGRES_USER:-prama}
      # Local-only fallback so the bootstrap topology is runnable. Replace in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prama_local_dev_only}
    volumes:
      - prama_postgres_data:/var/lib/postgresql/data
    networks: [prama_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build: ./gateway
    env_file:
      - ./gateway/.env
      - ./.secrets/gateway-worker.env
    environment:
      PORT: 8081
      TELEGRAPH_BASE_URL: ${TELEGRAPH_BASE_URL:-https://devnode.telegraphprotocol.com}
      TELEGRAPH_MAX_PAYMENT_USDC: ${TELEGRAPH_MAX_PAYMENT_USDC:-0.010000}
      PRAMA_TICKET_ANCHOR_ADDRESS: ${PRAMA_TICKET_ANCHOR_ADDRESS:-0x3c1a6acfd3b7ff981c31797533169e5ee36dd6e9}
      ERC8183_MAX_JOB_BUDGET_USDC: ${ERC8183_MAX_JOB_BUDGET_USDC:-2.000000}
      TELEGRAPH_CALLBACK_CONTRACT_ADDRESS: ${TELEGRAPH_CALLBACK_CONTRACT_ADDRESS:-}
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    networks: [prama_internal, external_services]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://prama:prama_local_dev_only@postgres:5432/prama_dynamagh}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672//}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8081}
      ERC8183_CALLBACK_ADDRESS: ${TELEGRAPH_CALLBACK_CONTRACT_ADDRESS:-}
      PRAMA_M2M_API_TOKEN: ${PRAMA_M2M_API_TOKEN:-}
      AUTONOMY_GLOBAL_ENABLED: ${AUTONOMY_GLOBAL_ENABLED:-false}
      PUBLIC_MAX_MANDATE_USDC: ${PUBLIC_MAX_MANDATE_USDC:-0.010000}
      PUBLIC_DAILY_SPEND_CAP_USDC: ${PUBLIC_DAILY_SPEND_CAP_USDC:-0.50}
      GLOBAL_DAILY_SPEND_CAP_USDC: ${GLOBAL_DAILY_SPEND_CAP_USDC:-${PUBLIC_DAILY_SPEND_CAP_USDC:-0.50}}
      PUBLIC_MANDATE_RATE_LIMIT: ${PUBLIC_MANDATE_RATE_LIMIT:-3}
      PUBLIC_MANDATE_RATE_WINDOW_SECONDS: ${PUBLIC_MANDATE_RATE_WINDOW_SECONDS:-3600}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks: [prama_internal, external_services]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    env_file:
      - ./.secrets/gateway-worker.env
    command: celery --app app.workers.celery_app worker --beat --loglevel=INFO
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://prama:prama_local_dev_only@postgres:5432/prama_dynamagh}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672//}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8081}
      ERC8183_CALLBACK_ADDRESS: ${TELEGRAPH_CALLBACK_CONTRACT_ADDRESS:-}
      ERC8183_LIVE_WRITES_ENABLED: ${ERC8183_LIVE_WRITES_ENABLED:-false}
      AUTONOMY_GLOBAL_ENABLED: ${AUTONOMY_GLOBAL_ENABLED:-false}
      PUBLIC_MAX_MANDATE_USDC: ${PUBLIC_MAX_MANDATE_USDC:-0.010000}
      PUBLIC_DAILY_SPEND_CAP_USDC: ${PUBLIC_DAILY_SPEND_CAP_USDC:-0.50}
      GLOBAL_DAILY_SPEND_CAP_USDC: ${GLOBAL_DAILY_SPEND_CAP_USDC:-${PUBLIC_DAILY_SPEND_CAP_USDC:-0.50}}
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks: [prama_internal, external_services]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      PORT: 80
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    networks: [prama_internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  prama_internal:
  external_services:
    external: true
    name: ${EXTERNAL_SERVICES_NETWORK:-firecrawl_backend}

volumes:
  prama_postgres_data:
