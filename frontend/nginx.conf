server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The browser can access only the API's deliberately exposed surfaces.
  # Gateway remains an internal service and is never proxied to the UI.
  location /api/ {
    proxy_pass ${API_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # x402 seller surfaces must reach the API before the SPA fallback. Keeping
  location ~ ^/(\.well-known/prama-agent\.json|agents\.md|llms\.txt|openapi\.json|mcp)$ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location = /v1/public/adoption {
    proxy_pass ${API_UPSTREAM}/v1/public/adoption;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
  }

  location = /adoption {
    try_files /adoption/index.html =404;
    add_header Cache-Control "no-cache";
  }

  # these routes here makes the frontend origin the canonical seller origin.
  location = /.well-known/x402-service.json {
    proxy_pass ${API_UPSTREAM}/.well-known/x402-service.json;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
  }

  location /v1/public/ {
    proxy_pass ${API_UPSTREAM}/v1/public/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Payment-Signature $http_payment_signature;
    proxy_set_header X-Payment $http_x_payment;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Agent-Id $http_x_agent_id;
    add_header Cache-Control "no-store" always;
  }

  location /titular-check/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }

  # The shell must always resolve the current Vite asset manifest after a
  # deployment; otherwise an old cached bundle can hide newly exposed proof.
  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
