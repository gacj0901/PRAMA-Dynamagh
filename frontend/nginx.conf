server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The browser can access only the API's deliberately exposed surfaces.
  # Gateway remains an internal service and is never proxied to the UI.
  location /api/ {
    proxy_pass ${API_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location /titular-check/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }

  # The shell must always resolve the current Vite asset manifest after a
  # deployment; otherwise an old cached bundle can hide newly exposed proof.
  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
